{% extends "tracker/base.html" %}

{% block content %}

<div class="auth-page">
  <div class="auth-card">

    <h2>Create New Password</h2>

    <form method="post">
      {% csrf_token %}

      {{ form.as_p }}

      <button
        type="submit"
        class="btn btn-primary w-100"
      >
        Update Password
      </button>
    </form>

  </div>
</div>

{% endblock %}
