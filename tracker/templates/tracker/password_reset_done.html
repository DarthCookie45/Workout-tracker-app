{% extends "tracker/base.html" %}

{% block content %}

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <i class="fa-solid fa-envelope"></i>
    </div>

    <h2>Check Your Email</h2>

    <p class="text-muted">
      If an account exists with that email address,
      a password reset link has been sent.
    </p>

    <a href="{% url 'login' %}" class="btn btn-primary w-100 mt-3">
      Back to Login
    </a>

  </div>
</div>

{% endblock %}
