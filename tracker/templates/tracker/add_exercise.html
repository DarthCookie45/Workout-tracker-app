{% extends "tracker/base.html" %} {% block content %}

<div class="container-fluid py-4">
  <div class="dashboard-layout">
    {% include "tracker/includes/sidebar.html" %}

    <main class="dashboard-main">
      <div class="card bg-white text-dark shadow">
        <div class="card-body">
          <a
            href="{% url 'routine_detail' routine.id %}"
            class="btn btn-outline-secondary mb-3"
          >
            <i class="fa-solid fa-arrow-left me-2"></i>
            Back to Routine
          </a>

          <h1>Add Exercise to {{ routine.name }}</h1>

          <a
            href="{% url 'exercise_library' routine.id %}"
            class="btn btn-primary mb-3"
          >
            <i class="fa-solid fa-book-open me-2"></i>
            Browse Exercise Library
          </a>

          <form method="POST">
            {% csrf_token %} {{ form.as_p }}

            <button type="submit" class="btn btn-success">Save Exercise</button>

            <a
              href="{% url 'routine_detail' routine.id %}"
              class="btn btn-outline-secondary"
            >
              Cancel
            </a>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>

{% endblock %}
