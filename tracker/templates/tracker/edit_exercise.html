{% extends "tracker/base.html" %} {% block content %}

<div class="container-fluid py-4">
  <div class="dashboard-layout">
    {% include "tracker/includes/sidebar.html" %}

    <main class="dashboard-main">
      <div class="card bg-white text-dark shadow">
        <div class="card-body">
          <a
            href="{% url 'routine_detail' routine.id %}"
            class="btn btn-outline-secondary mb-3"
          >
            <i class="fa-solid fa-arrow-left me-2"></i>
            Back to Routine
          </a>

          <h1>Edit Exercise</h1>

          <p class="text-muted">Routine: {{ routine.name }}</p>

          <a
            href="{% url 'exercise_library' routine.id %}?next=edit&exercise_id={{ form.instance.id }}"
            class="btn btn-outline-primary mb-3"
          >
            <i class="fa-solid fa-magnifying-glass me-2"></i>
            Browse Library
          </a>

          <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            {% if bodyweight %}
            <button
              type="button"
              class="btn btn-outline-secondary btn-sm mb-3"
              onclick="useBodyweight()"
            >
              Use Bodyweight ({{ bodyweight }}kg)
                     </button>
            {% endif %}
                 
            <br>
                 
            <button type="submit" class="btn btn-success">
              Save Changes
            </button>

            <a
              href="{% url 'routine_detail' routine.id %}"
              class="btn btn-outline-secondary"
            >
              Cancel
            </a>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
function useBodyweight() {
  document.getElementById("id_weight").value = "{{ bodyweight }}";
}
</script>

{% endblock %}
