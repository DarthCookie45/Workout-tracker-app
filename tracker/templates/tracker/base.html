{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Tracker App</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'tracker/css/styles.css' %}" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body class="bg-dark bg-secondary text-light">
    <nav class="navbar navbar-dark bg-black shadow">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
          💪 Workout Tracker App
        </a>

        <div>
          {% if user.is_authenticated %}

          <span class="text-light me-3"> Hello, {{ user.username }} </span>

          <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">
            Logout
          </a>

          {% else %}

          <a href="{% url 'register' %}" class="btn btn-success btn-sm me-2">
            Register
          </a>

          <a href="{% url 'login' %}" class="btn btn-primary btn-sm"> Login </a>

          {% endif %}
        </div>
      </div>
    </nav>

    <div class="container mt-3">
      {% if messages %} {% for message in messages %}
      <div class="alert alert-success alert-dismissible fade show" role="alert">
        {{ message }}
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>
      {% endfor %} {% endif %}
    </div>

    <div class="container mt-4">{% block content %} {% endblock %}</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
